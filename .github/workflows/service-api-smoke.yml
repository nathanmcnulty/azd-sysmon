name: Read-only service API smoke
on:
  schedule:
    - cron: '41 8 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: service-api-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: github.repository == 'nathanmcnulty/azd-sysmon' && github.ref == 'refs/heads/main' && vars.SYSMON_API_SMOKE_ENABLED == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select pinned PowerShell runtime
        id: runtime
        run: |
          $runtimePath = & ./scripts/Install-PowerShellRuntime.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'powershell-7.6.6')
          "path=$runtimePath" >> $env:GITHUB_OUTPUT
      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.SYSMON_API_SMOKE_CLIENT_ID }}
          tenant-id: ${{ secrets.SYSMON_API_SMOKE_TENANT_ID }}
          subscription-id: ${{ secrets.SYSMON_API_SMOKE_SUBSCRIPTION_ID }}
      - name: Probe fixed service routes
        env:
          POWERSHELL_PATH: ${{ steps.runtime.outputs.path }}
          TENANT_ID: ${{ secrets.SYSMON_API_SMOKE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ secrets.SYSMON_API_SMOKE_SUBSCRIPTION_ID }}
          PRINCIPAL_ID: ${{ secrets.SYSMON_API_SMOKE_PRINCIPAL_ID }}
        run: |
          $reportPath = Join-Path $env:RUNNER_TEMP 'sysmon-api-smoke.json'
          & $env:POWERSHELL_PATH -NoLogo -NoProfile -NonInteractive -File ./scripts/Test-ServiceApis.ps1 -Run -TenantId $env:TENANT_ID -SubscriptionId $env:SUBSCRIPTION_ID -ExpectedPrincipalId $env:PRINCIPAL_ID -ReportPath $reportPath
          if ($LASTEXITCODE -ne 0) { throw 'Read-only smoke did not pass all four probes.' }
      - name: Retain redacted service results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: service-api-smoke
          path: ${{ runner.temp }}/sysmon-api-smoke.json
          if-no-files-found: ignore
          retention-days: 7
